[project]
name = "hermes-plugin-vt-check"
version = "0.1.1"
description = "VirusTotal reputation for downloads and links — hash-only lookups, never uploads."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aravinth S" }]
keywords = ["hermes", "hermes-plugin", "virustotal", "malware", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
# No third-party runtime dependencies: stdlib only (catalog rule 10 is then trivially satisfied).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.urls]
Homepage = "https://github.com/Aravinth-Earth/vt-check"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
