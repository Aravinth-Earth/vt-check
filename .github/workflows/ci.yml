name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # the `gates` job is manual: it installs Hermes from source

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=8,<9" "pyyaml>=6,<7"
      - name: Unit tests (no network, no Hermes needed)
        run: pytest -q
      - name: Forbid committed bytecode / binaries (catalog rule 17)
        run: |
          if git ls-files | grep -Eq '\.(pyc|pyo|so|dll|dylib|exe|wasm)$'; then
            echo "committed bytecode or binaries are rejected at catalog admission"
            exit 1
          fi

  gates:
    # The same two checks catalog CI runs. Manual only: it installs Hermes from source,
    # and the local equivalent is `./scripts/gates.sh`.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Hermes
        run: |
          curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.hermes/hermes-agent/venv/bin" >> "$GITHUB_PATH"
      - name: Plugin doctor
        env:
          VT_API_KEY: dummy-for-ci
        run: hermes plugins doctor ./plugin --ci
      - name: Catalog validate
        env:
          VT_API_KEY: dummy-for-ci
        run: hermes plugins validate ./plugin
